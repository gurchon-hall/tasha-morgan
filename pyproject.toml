    "src/vtesbot/cards/wider_view.py",
    "src/vtesbot/engine/hook_contexts.py",
]
typeCheckingMode = "basic"
pythonVersion = "3.14"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["vtesbot"]
