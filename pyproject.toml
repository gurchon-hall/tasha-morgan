[project]
name = "vtesbot"
version = "0.1.0"
description = "A bot that plays Vampire: The Eternal Struggle in a two-player duel (VEKN 2P variant)."
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "krcg>=5.14,<6",
]

[project.optional-dependencies]
dev = [
    "pymarkdownlnt>=0.9.40",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vtesbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["vtesbot"]
