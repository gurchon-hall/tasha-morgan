[project]
name = "vtesbot"
version = "0.1.0"
description = "A bot that plays Vampire: The Eternal Struggle in a two-player duel (VEKN 2P variant)."
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "krcg>=5.14,<6",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40",
    "pre-commit-hooks>=5.0",
    "pymarkdownlnt>=0.9.40",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vtesbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.basedpyright]
# Modules on the `Card` API (CLAUDE.md §10); add each card module as it migrates.
include = [
    "src/vtesbot/cards/alexa_draper.py",
    "src/vtesbot/cards/alice_chen.py",
    "src/vtesbot/cards/aniel.py",
    "src/vtesbot/cards/atiena.py",
    "src/vtesbot/cards/bonding.py",
    "src/vtesbot/cards/card.py",
    "src/vtesbot/cards/carmelita_neillson.py",
    "src/vtesbot/cards/celerity.py",
    "src/vtesbot/cards/common.py",
    "src/vtesbot/cards/diana_iadanza.py",
    "src/vtesbot/cards/disputed_territory.py",
    "src/vtesbot/cards/dominate_kine.py",
    "src/vtesbot/cards/dust_up.py",
    "src/vtesbot/cards/enchant_kindred.py",
    "src/vtesbot/cards/eyes_of_argus.py",
    "src/vtesbot/cards/fame.py",
    "src/vtesbot/cards/fiorenza_savona.py",
    "src/vtesbot/cards/fleetness.py",
    "src/vtesbot/cards/grooming_the_protege.py",
    "src/vtesbot/cards/horst_von_bruhl.py",
    "src/vtesbot/cards/kasim_bayar.py",
    "src/vtesbot/cards/kevin_jackson.py",
    "src/vtesbot/cards/kine_resources_contested.py",
